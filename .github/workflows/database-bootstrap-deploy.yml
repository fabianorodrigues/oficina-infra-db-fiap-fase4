name: Database Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP to initialize the databases.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: database-bootstrap
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  # Limite conservador para o corpo de um Run Command. Acima disso o comando e
  # truncado em silencio, e truncamento silencioso e o modo de falha que este
  # limite existe para impedir.
  MAX_MANIFEST_BYTES: "30000"

jobs:
  bootstrap:
    name: Bootstrap SQL databases through a Kubernetes Job
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQL_TOOLS_IMAGE: ${{ vars.SQL_TOOLS_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate request
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'This workflow must run from main.'
          }
          if ('${{ inputs.confirmation }}' -cne 'BOOTSTRAP') {
            throw 'Confirmation must be BOOTSTRAP.'
          }
          foreach ($name in @('AWS_REGION', 'SQL_TOOLS_IMAGE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Repository Variable $name is required."
            }
          }
          if ($env:SQL_TOOLS_IMAGE -notmatch ':' -or $env:SQL_TOOLS_IMAGE -match ':latest$') {
            throw 'SQL_TOOLS_IMAGE must use an explicit tag or digest and never latest.'
          }

      - name: Validate contracts
        shell: pwsh
        run: |
          ./scripts/validate-database-secrets-config.ps1 -ConfigPath config/database-secrets.json
          ./scripts/validate-database-bootstrap-config.ps1 -ConfigPath config/database-bootstrap.json -SecretsConfigPath config/database-secrets.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate AWS identity
        shell: pwsh
        run: aws sts get-caller-identity

      - name: Resolve cluster and database metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Ssm([string]$name) {
            $v = aws ssm get-parameter --name $name --region $env:AWS_REGION --query 'Parameter.Value' --output text
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v) -or $v -eq 'None') {
              throw "Missing or empty SSM parameter: $name"
            }
            return $v.Trim()
          }

          $config = Get-Content -LiteralPath 'config/database-bootstrap.json' -Raw | ConvertFrom-Json
          $namespace = Get-Ssm $config.kubernetes.namespaceParameter
          $instanceId = Get-Ssm $config.kubernetes.instanceIdParameter
          $repository = Get-Ssm $config.kubernetes.imageRepositoryParameter
          $rdsHost = Get-Ssm $config.rds.endpointParameter
          $rdsPort = Get-Ssm $config.rds.portParameter
          $masterSecret = Get-Ssm $config.rds.masterSecretArnParameter

          if ($rdsPort -notmatch '^\d+$') { throw "Invalid RDS port in SSM: $rdsPort" }
          if ($instanceId -notmatch '^i-[0-9a-f]+$') { throw 'Invalid Kubernetes node instance id in SSM.' }

          $ping = aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$instanceId" --region $env:AWS_REGION --query 'InstanceInformationList[0].PingStatus' --output text
          if ($ping -ne 'Online') { throw "Kubernetes node $instanceId is not Online in Systems Manager (status: $ping)." }

          "K8S_NAMESPACE=$namespace" | Add-Content -Path $env:GITHUB_ENV
          "K8S_INSTANCE_ID=$instanceId" | Add-Content -Path $env:GITHUB_ENV
          "BOOTSTRAP_IMAGE=${repository}:$env:GITHUB_SHA" | Add-Content -Path $env:GITHUB_ENV
          "RDS_HOST=$rdsHost" | Add-Content -Path $env:GITHUB_ENV
          "RDS_PORT=$rdsPort" | Add-Content -Path $env:GITHUB_ENV
          "MASTER_SECRET_ID=$masterSecret" | Add-Content -Path $env:GITHUB_ENV

          $timeout = [int]($config.job.timeoutSeconds)
          if ($timeout -le 0) { $timeout = 900 }
          "JOB_TIMEOUT_SECONDS=$timeout" | Add-Content -Path $env:GITHUB_ENV
          Write-Host 'Resolved Kubernetes, RDS and registry metadata.'

      - name: Validate SQL secrets
        shell: pwsh
        run: ./scripts/validate-database-secret-containers.ps1 -ConfigPath config/database-secrets.json -Region $env:AWS_REGION -RequireCurrentVersion $true

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push bootstrap image
        shell: bash
        run: |
          set -euo pipefail
          image_without_registry="${BOOTSTRAP_IMAGE#*/}"
          repository_name="${image_without_registry%:*}"
          image_tag="${BOOTSTRAP_IMAGE##*:}"

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids imageTag="$image_tag" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Bootstrap image $repository_name:$image_tag already exists in ECR; reusing it for this rerun."
            exit 0
          fi

          docker build --build-arg SQL_TOOLS_IMAGE="$SQL_TOOLS_IMAGE" -f Dockerfile.bootstrap -t "$BOOTSTRAP_IMAGE" .
          docker push "$BOOTSTRAP_IMAGE"

      - name: Run database bootstrap job
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/run-database-job.sh \
            --manifest k8s/db-bootstrap-job.yaml \
            --job-name "oficina-db-bootstrap-${GITHUB_RUN_ID}" \
            --secret-name oficina-db-bootstrap-credentials \
            --secret-source bootstrap

      - name: Publish summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath 'config/database-bootstrap.json' -Raw | ConvertFrom-Json
          $lines = @()
          $lines += '## Database Bootstrap'
          $lines += ''
          $lines += "Namespace: $env:K8S_NAMESPACE"
          $lines += "Job: oficina-db-bootstrap-$env:GITHUB_RUN_ID"
          $lines += "Image: $env:BOOTSTRAP_IMAGE"
          $lines += ''
          $lines += 'Expected databases:'
          foreach ($d in $config.databases) { $lines += "- $($d.name)" }
          $lines += ''
          $lines += 'Secrets were read from Secrets Manager inside the node and materialised as a temporary'
          $lines += 'Kubernetes Secret removed in a finally block. No secret value passed through the runner,'
          $lines += 'through S3 or as a Run Command parameter.'
          ($lines -join "`n") | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  database-isolation:
    name: Validate database isolation
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve cluster and database metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Ssm([string]$name) {
            $v = aws ssm get-parameter --name $name --region $env:AWS_REGION --query 'Parameter.Value' --output text
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($v) -or $v -eq 'None') { throw "Missing or empty SSM parameter: $name" }
            return $v.Trim()
          }
          $config = Get-Content -LiteralPath 'config/database-bootstrap.json' -Raw | ConvertFrom-Json
          "K8S_NAMESPACE=$(Get-Ssm $config.kubernetes.namespaceParameter)" | Add-Content -Path $env:GITHUB_ENV
          "K8S_INSTANCE_ID=$(Get-Ssm $config.kubernetes.instanceIdParameter)" | Add-Content -Path $env:GITHUB_ENV
          "BOOTSTRAP_IMAGE=$(Get-Ssm $config.kubernetes.imageRepositoryParameter):$env:GITHUB_SHA" | Add-Content -Path $env:GITHUB_ENV
          "RDS_HOST=$(Get-Ssm $config.rds.endpointParameter)" | Add-Content -Path $env:GITHUB_ENV
          "RDS_PORT=$(Get-Ssm $config.rds.portParameter)" | Add-Content -Path $env:GITHUB_ENV
          "MASTER_SECRET_ID=$(Get-Ssm $config.rds.masterSecretArnParameter)" | Add-Content -Path $env:GITHUB_ENV
          $timeout = [int]($config.job.timeoutSeconds)
          if ($timeout -le 0) { $timeout = 900 }
          "JOB_TIMEOUT_SECONDS=$timeout" | Add-Content -Path $env:GITHUB_ENV

      - name: Run isolation job
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/run-database-job.sh \
            --manifest k8s/db-isolation-job.yaml \
            --job-name "oficina-db-isolation-${GITHUB_RUN_ID}" \
            --secret-name oficina-db-isolation-credentials \
            --secret-source isolation \
            --summary-title 'Matriz de isolamento 6 x 3'
